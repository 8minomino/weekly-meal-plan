<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7efe3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="献立">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>飯野家の夕食献立</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div class="hero__label">IINO FAMILY DINNER</div>
    <h1>飯野家の夕食献立</h1>
    <p id="weekRange">読み込み中</p>
    <svg class="hero-bunny" viewBox="0 0 180 180" aria-hidden="true">
      <ellipse cx="62" cy="54" rx="22" ry="48" fill="#fffdf8" stroke="#00572d" stroke-width="5"/>
      <ellipse cx="115" cy="54" rx="22" ry="48" fill="#fffdf8" stroke="#00572d" stroke-width="5"/>
      <circle cx="90" cy="102" r="50" fill="#fffdf8" stroke="#00572d" stroke-width="5"/>
      <circle cx="72" cy="95" r="5" fill="#173526"/>
      <circle cx="108" cy="95" r="5" fill="#173526"/>
      <path d="M82 115c6 5 11 5 17 0" fill="none" stroke="#173526" stroke-width="4" stroke-linecap="round"/>
      <path d="M55 140c22 19 48 20 72 0" fill="none" stroke="#8cc63f" stroke-width="12" stroke-linecap="round"/>
      <circle cx="135" cy="58" r="14" fill="#f5cf32"/>
      <path d="M139 43c13-14 28-16 42-7-14 4-23 13-27 27" fill="#d8ee84"/>
    </svg>
  </header>

  <main>
    <section class="summary" aria-label="基本方針">
      <div>
        <span>基本</span>
        <strong>ごはん + 味噌汁 + 野菜料理 + 主菜</strong>
      </div>
      <div>
        <span>一覧</span>
        <button class="outline-button" id="toggleWeek" type="button" aria-expanded="false">1週間分の献立を見る</button>
      </div>
    </section>

    <section class="week-panel" id="weekPanel" hidden>
      <div class="section-title">
        <span>WEEKLY MENU</span>
        <h2>1週間分の献立</h2>
      </div>
      <div class="week-table" id="weekTable"></div>
    </section>

    <nav class="day-tabs" id="dayTabs" aria-label="曜日選択"></nav>

    <section class="meal-card" id="mealCard" aria-live="polite"></section>

    <section class="shopping">
      <div class="section-title">
        <span>SHOPPING</span>
        <h2>買い物リスト</h2>
      </div>
      <div class="shopping__grid" id="shoppingList"></div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
